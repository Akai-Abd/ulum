<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Outer Glow / Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Arrow Gradient 1 -->
    <linearGradient id="arrowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Arrow Gradient 2 -->
    <linearGradient id="arrowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Central Cube Shading -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Subtle Inner Radial Glow -->
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.06"/>

  <!-- Orbit Track -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" opacity="0.35"/>

  <!-- Top Counter-Clockwise Sync Arc & Arrow -->
  <g filter="url(#glow)">
    <path d="M 136 210 A 148 148 0 0 1 386 195" fill="none" stroke="url(#arrowCyan)" stroke-width="26" stroke-linecap="round"/>
    <polygon points="408,206 380,165 365,225" fill="#38bdf8"/>
  </g>

  <!-- Bottom Counter-Clockwise Sync Arc & Arrow -->
  <g filter="url(#glow)">
    <path d="M 376 302 A 148 148 0 0 1 126 317" fill="none" stroke="url(#arrowViolet)" stroke-width="26" stroke-linecap="round"/>
    <polygon points="104,306 132,347 147,287" fill="#c084fc"/>
  </g>

  <!-- Central Unified Package Isometric Cube -->
  <g filter="url(#shadow)" transform="translate(0, -2)">
    <!-- Top Face -->
    <polygon points="256,182 316,216 256,250 196,216" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="196,216 256,250 256,322 196,288" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="256,250 316,216 316,288 256,322" fill="url(#cubeRight)"/>
    <!-- Box Seam Accent Lines -->
    <line x1="256" y1="182" x2="256" y2="250" stroke="#bae6fd" stroke-width="2.5" opacity="0.7"/>
    <line x1="196" y1="216" x2="256" y2="250" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="316" y1="216" x2="256" y2="250" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="256" y1="250" x2="256" y2="322" stroke="#e0e7ff" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Central Modern Micro-emblem (Core Dot) -->
  <circle cx="256" cy="250" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
