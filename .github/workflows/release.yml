name: Release & Packaging

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 xvfb

      - name: Install Python Dependencies & Test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest PyGObject || pip install pytest
          xvfb-run -a pytest -v || pytest -v

      - name: Build Debian Package
        run: |
          ./scripts/build_deb.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
